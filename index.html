<!doctype html>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Libre+Caslon+Text:ital@0;1&display=swap">
<style>
/* Layout: one phone-sized desk, rendered in 3D as a printed miniature (same print shading, window light, tilt-shift as the AFTERSTILL works). DOM UI floats on top as printed cards. Single light look by choice. */
:root{
  color-scheme:light;
  --frame:#e9dfcb;
  --paper:#f4eee1;
  --ink:#2b2f52;
  --ink-soft:#6a6658;
  --cobalt:#2d55d6;
  --red:#e1352c;
  --sans:"IBM Plex Sans","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --serif:"Libre Caslon Text","Songti SC","Noto Serif SC",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--frame);color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--sans);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit}
button:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.stage{position:relative;width:390px;height:844px;flex:none;overflow:hidden;transform-origin:center;background:var(--paper);touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.grain{position:absolute;inset:0;pointer-events:none;z-index:40;opacity:.06;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .45 0 0 0 0 .4 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:39;background:radial-gradient(120% 90% at 50% 46%,transparent 58%,rgba(90,60,30,.16))}

/* printed cards */
.bubble{position:absolute;padding:10px 14px 11px;font-size:14px;line-height:1.45;border-radius:4px;opacity:0;transition:opacity .25s ease,translate .25s ease;translate:0 6px;pointer-events:none;z-index:20;border:1.5px solid var(--ink)}
.bubble.on{opacity:1;translate:0 0}
.bubble small{display:block;margin-bottom:3px;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.ai{left:34px;right:34px;top:54px;background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--cobalt)}
.ai small{color:var(--cobalt)}
.ai::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;margin-left:-7px;background:var(--paper);border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
.you{left:22px;right:22px;bottom:44px;background:var(--cobalt);color:var(--paper);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.you small{color:#c9d4fb}

.choices{position:absolute;left:20px;right:20px;bottom:30px;display:flex;flex-direction:column;gap:9px;z-index:21}
.choices[hidden]{display:none}
.choices .label{align-self:flex-start;padding:3px 7px;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--paper);background:var(--ink);border-radius:2px}
.choices button{min-height:44px;padding:10px 14px;text-align:left;font-size:14px;line-height:1.4;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--ink);border-radius:4px;cursor:pointer;box-shadow:4px 4px 0 var(--red);transition:transform .12s,box-shadow .12s}
.choices button:hover{background:#fbf6ea}
.choices button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--red)}

.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:11px;letter-spacing:.08em;color:var(--ink-soft);opacity:0;transition:opacity .4s;z-index:21}
.hint.on{opacity:1;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.offline{position:absolute;left:50%;top:150px;translate:-50% 0;padding:5px 10px;font-size:12px;letter-spacing:.06em;color:var(--paper);background:var(--ink);border-radius:2px;opacity:0;transition:opacity .3s;z-index:22;pointer-events:none;white-space:nowrap}
.offline.on{opacity:1}

.end{position:absolute;left:0;right:0;top:86px;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:30;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.end.on{opacity:1;pointer-events:auto}
.end .kicker{font:italic 400 15px/1 var(--serif);letter-spacing:.04em;color:var(--ink)}
.end h1{margin:0 24px;padding:12px 18px 14px;max-width:330px;text-align:center;white-space:pre-line;font:500 22px/1.5 var(--serif);color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--red)}
.end h1:lang(en){font-size:21px;font-style:italic;font-weight:400}
.end button{min-height:40px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}

.lang{position:absolute;right:14px;top:14px;z-index:35;min-width:44px;min-height:32px;padding:0 10px;border-radius:999px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font-size:12px;cursor:pointer}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:var(--paper);color:var(--ink-soft);font-size:12px;letter-spacing:.1em;transition:opacity .6s}
.loading.off{opacity:0;pointer-events:none}

.stage.still .bubble,.stage.still .lang,.stage.still .hint,.stage.still .choices,.stage.still .offline{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<div class="stage" id="stage">
  <canvas id="gl" width="720" height="1560"></canvas>
  <div class="vignette"></div>
  <div class="bubble ai" id="ai"><small id="aiLabel"></small><span id="aiText"></span></div>
  <div class="offline" id="offline"></div>
  <div class="bubble you" id="you"><small id="youLabel"></small><span id="youText"></span></div>
  <div class="choices" id="choices" hidden></div>
  <div class="hint" id="hint"></div>
  <div class="end" id="end"><span class="kicker">The Last Job</span><h1 id="claim"></h1><button type="button" id="again"></button></div>
  <button class="lang" type="button" id="lang"></button>
  <div class="grain"></div>
  <div class="loading" id="loading">…</div>
</div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

// The Last Job：俯瞰一张书桌，笔记本是 AI，读者是“你”。所有东西走 AFTERSTILL 的版画着色：一开场被扫描线印出来，之后 AI 每写一份文件，就印出一张纸落到桌上。
const STILL = new URLSearchParams(location.search).has('still');   // ?still：高清定格一张（给期刊配图），自动走完故事、不合盖、不显示界面
const CW = STILL ? 1440 : 720, CH = STILL ? 3120 : 1560;
let SEED = 7;
const rand = () => { SEED = (SEED * 16807) % 2147483647; return (SEED - 1) / 2147483646; };
const rnd = (a = 0, b = 1) => a + rand() * (b - a);
const mrnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ni = g => g.index ? g.toNonIndexed() : g;
const C = h => new THREE.Color(h);
const Vt = (x, y, z) => new THREE.Vector3(x, y, z);
const X = Vt(1, 0, 0), NX = Vt(-1, 0, 0), Y = Vt(0, 1, 0), Z = Vt(0, 0, 1), NZ = Vt(0, 0, -1);
const $ = id => document.getElementById(id);

// ---------- 调色板（同《落地生根》） ----------
const PAPER = C('#f4eee1');
const FLOOR = C('#e6dac4'), HAZE = '#efe5d2';

// ---------- 输出 ----------
const renderer = new THREE.WebGLRenderer({canvas: $('gl'), antialias: true});
renderer.setPixelRatio(1);
renderer.setSize(CW, CH, false);
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = C(HAZE);
scene.fog = new THREE.Fog(C(HAZE), 60, 140);
const FOV = 26;
const camera = new THREE.PerspectiveCamera(FOV, CW / CH, 0.5, 300);
const hemi = new THREE.HemisphereLight(C('#bcd0ee'), C('#f1dcc0'), 1.15);
const SUN_DIR = Vt(-.64, .52, .5).normalize();
const sun = new THREE.DirectionalLight(C('#ffe6c2'), 3.9);
sun.position.copy(SUN_DIR).multiplyScalar(40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left: -11, right: 11, top: 11, bottom: -11, near: .5, far: 120});
sun.shadow.bias = -0.0003; sun.shadow.normalBias = .02;
scene.add(hemi, sun);

// ---------- 版画材质：所有东西共用一套“印刷”着色（同《小星星》） ----------
const uPaper = {value: PAPER};
const PRINT_GLSL = `
  uniform vec3 uPaper;
  varying vec3 vInk; varying vec2 vUV; varying vec2 vPS; varying float vLy;
  float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
  float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
    return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + 1.), f.x), f.y); }
  float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 17.1; a *= .5; } return s / .9375; }
  float aline(float d, float w){ float fw = fwidth(d) * .8 + 1e-4; return 1. - smoothstep(w - fw, w + fw, d); }
  vec3 printInk(vec3 base, vec3 ink, int pat, vec2 uv, float seed){
    vec2 q = uv + seed * 7.31;
    vec3 c = base;
    if (pat == 1) {                                     // 纱网
      vec2 g = q * 23.; g.x += .22 * sin(q.y * 9. + seed * 6.); g.y += .22 * sin(q.x * 7.3 + seed);
      vec2 f = abs(fract(g) - .5); float l = max(aline(f.x, .09), aline(f.y, .09)) * (.55 + .45 * vn(q * 37.));
      c = mix(base, ink, l);
    } else if (pat == 2) {                              // 圆点
      vec2 g = q * 17.; g.x += .5 * mod(floor(g.y), 2.);
      c = mix(base, ink, aline(length(fract(g) - .5), .23) * (.7 + .3 * vn(q * 30.)));
    } else if (pat == 3) {                              // 木纹竖线
      float f = abs(fract(q.x * 21. + .35 * vn(q * vec2(3., 18.))) - .5);
      c = mix(base, ink, aline(f, .07) * .8);
    } else if (pat == 7) {                              // 叶片
      vec2 g = q * 13.; vec2 id = floor(g); vec2 f = fract(g) - .5 - (vec2(h21(id), h21(id + 9.)) - .5) * .4;
      float a = h21(id + 3.) * 6.28; f = mat2(cos(a), -sin(a), sin(a), cos(a)) * f;
      c = mix(base, ink, aline(length(f * vec2(1., 2.3)), .26) * step(.25, h21(id + 5.)));
    } else if (pat == 10) {                             // 纸
      return base * (.955 + .06 * fbm(q * 2.2) + .025 * vn(vec2(q.x * 3., q.y * 70.)));
    } else if (pat == 12) {                             // 横条纹
      c = mix(base, ink, aline(abs(fract(q.y * 13.) - .5), .2));
    }
    float m = fbm(q * vec2(5., 8.));                    // 油墨浓淡
    float st = vn(vec2(q.x * 1.3, q.y * 55.));          // 滚筒刷痕
    c *= .84 + .28 * m + .13 * (st - .5);
    float sp = vn(q * 46.) * fbm(q * 9. + 4.);          // 露白
    return mix(c, uPaper, smoothstep(.46, .72, sp) * .62);
  }`;

// ---------- 几何构造器：一个个面拼出来 ----------
class GB {
  constructor() { this.P = []; this.N = []; this.Cc = []; this.K = []; this.U = []; this.S = []; this.M = new THREE.Matrix4(); }
  poly(pts, uvs, col, ink, pat, seed) {
    pts = pts.map(p => p.clone().applyMatrix4(this.M));
    const n = new THREE.Vector3().subVectors(pts[1], pts[0]).cross(new THREE.Vector3().subVectors(pts[2], pts[0])).normalize();
    if (!uvs) { const t = new THREE.Vector3().subVectors(pts[1], pts[0]).normalize(), bt = new THREE.Vector3().crossVectors(n, t);
      uvs = pts.map(p => { const d = new THREE.Vector3().subVectors(p, pts[0]); return [d.dot(t), d.dot(bt)]; }); }
    for (let k = 1; k + 1 < pts.length; k++) for (const j of [0, k, k + 1]) {
      const p = pts[j]; this.P.push(p.x, p.y, p.z); this.N.push(n.x, n.y, n.z); this.Cc.push(col.r, col.g, col.b); this.K.push(ink.r, ink.g, ink.b);
      this.U.push(uvs[j][0], uvs[j][1]); this.S.push(pat, seed);
    }
  }
  rect(o, r, u, w, h, col, ink, pat, seed) { const b = o.clone().addScaledVector(r, w); this.poly([o, b, b.clone().addScaledVector(u, h), o.clone().addScaledVector(u, h)], null, col, ink, pat, seed); }
  build() {
    const f = (a, n) => new THREE.Float32BufferAttribute(a, n), g = new THREE.BufferGeometry();
    g.setAttribute('position', f(this.P, 3)); g.setAttribute('normal', f(this.N, 3)); g.setAttribute('color', f(this.Cc, 3));
    g.setAttribute('aInk', f(this.K, 3)); g.setAttribute('aUV', f(this.U, 2)); g.setAttribute('aPS', f(this.S, 2));
    g.computeBoundingBox(); g.computeBoundingSphere(); return g;
  }
}
// ---------- 曲面也走版画着色 ----------
function paint(geo, col, ink, pat, seed = rnd(0, 50), sc = 1) {
  geo = ni(geo); const n = geo.attributes.position.count, uv = geo.attributes.uv, [sx, sy] = Array.isArray(sc) ? sc : [sc, sc];
  const cA = new Float32Array(n * 3), kA = new Float32Array(n * 3), uA = new Float32Array(n * 2), sA = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) {
    cA.set([col.r, col.g, col.b], i * 3); kA.set([ink.r, ink.g, ink.b], i * 3); sA.set([pat, seed], i * 2);
    if (uv) uA.set([uv.getX(i) * sx, uv.getY(i) * sy], i * 2);
  }
  if (uv) geo.deleteAttribute('uv');
  geo.setAttribute('color', new THREE.BufferAttribute(cA, 3)); geo.setAttribute('aInk', new THREE.BufferAttribute(kA, 3));
  geo.setAttribute('aUV', new THREE.BufferAttribute(uA, 2)); geo.setAttribute('aPS', new THREE.BufferAttribute(sA, 2));
  return geo;
}
// ---------- 会被扫描线“印”出来的版画材质（同《小星星》）：每个顶点带 aT，扫描线按世界高度往上切 ----------
const uClock = {value: 99}, PRINT_RATE = '1.6';
const ORIGIN = {x: 0, z: 0};
const setT = (geo, t) => geo.setAttribute('aT', new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count).fill(t), 1));
const printDelay = (x, z) => .1 + Math.hypot(x - ORIGIN.x, z - ORIGIN.z) * .09;
function printMatT() {
  const m = new THREE.MeshStandardMaterial({vertexColors: true, roughness: .93, side: THREE.DoubleSide});
  m.onBeforeCompile = function (sh) {
    Object.assign(sh.uniforms, {uPaper, uClock});
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute vec3 aInk; attribute vec2 aUV; attribute vec2 aPS; attribute float aT; uniform float uClock; varying vec3 vInk; varying vec2 vUV; varying vec2 vPS; varying float vLy; varying float vSc;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvInk = aInk; vUV = aUV; vPS = aPS; vSc = (uClock - aT) * ' + PRINT_RATE + '; vLy = (modelMatrix * vec4(transformed, 1.)).y;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\n' + PRINT_GLSL + '\nuniform float uClock; varying float vSc;')
      .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (vLy > vSc) discard;')
      .replace('#include <color_fragment>', `diffuseColor.rgb = printInk(vColor, vInk, int(vPS.x + .5), vUV, vPS.y);
        float printing = 1. - step(3.2, vSc);
        if (!gl_FrontFacing && printing > .5) diffuseColor.rgb = uPaper;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        totalEmissiveRadiance += (1. - smoothstep(0., .06, abs(vLy - vSc))) * printing * vec3(1.5, 1.8, 2.6) + (gl_FrontFacing ? 0. : printing) * vec3(.55, .75, 1.25);`);
  };
  m.customProgramCacheKey = () => 'printT';
  return m;
}
const TDEPTH = new THREE.MeshDepthMaterial({depthPacking: THREE.RGBADepthPacking, side: THREE.DoubleSide});
TDEPTH.onBeforeCompile = sh => { Object.assign(sh.uniforms, {uClock});
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float aT; uniform float uClock; varying float vSc; varying float vLy;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvSc = (uClock - aT) * ' + PRINT_RATE + '; vLy = (modelMatrix * vec4(transformed, 1.)).y;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vSc; varying float vLy;')
    .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (vLy > vSc) discard;'); };
TDEPTH.customProgramCacheKey = () => 'printTDepth';
const TMAT = printMatT();
// 一件东西：版画着色 + 开场被印出来（延迟按离桌子中心的距离算）
function part(geo, col, ink, pat, sc, at) {
  const g = paint(geo, C(col), C(ink), pat, rnd(0, 50), sc);
  const m = new THREE.Mesh(g, TMAT); m.castShadow = m.receiveShadow = true; m.customDepthMaterial = TDEPTH; m.userData.at = at; return m;
}
const printable = [];
function place(obj, x, z) {   // 放好以后，按世界位置给整件东西定开场印的时间
  obj.updateMatrixWorld(true);
  const t = printDelay(x, z);
  obj.traverse(o => { if (o.isMesh && o.geometry.attributes.aInk) { setT(o.geometry, t + (o.userData.at || 0)); printable.push(o); } });
}

const world = new THREE.Group(); scene.add(world);
const lateShow = [];

// ---------- 画布贴图：纸、屏幕、手机都是画出来的 ----------
const SERIF = '"Songti SC","Noto Serif SC","Libre Caslon Text",Georgia,serif', SANS = '"PingFang SC","Noto Sans SC","IBM Plex Sans",system-ui,sans-serif';
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.userData.c = c; return t;
}
function wrap(g, text, x, y, maxW, lh, maxLines = 9) {
  const words = /[一-鿿]/.test(text) ? [...text] : text.split(/(\s+)/);
  let line = '', n = 0;
  for (const w of words) { const test = line + w; if (g.measureText(test).width > maxW && line.trim()) { g.fillText(line.trim(), x, y); y += lh; line = w.trim() ? w : ''; if (++n >= maxLines) return y; } else line = test; }
  if (line.trim()) { g.fillText(line.trim(), x, y); y += lh; }
  return y;
}
function paperBg(g, w, h, col = '#fffcf5') {
  g.fillStyle = col; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 2600; k++) { g.fillStyle = `rgba(120,100,70,${mrnd(.015, .05)})`; g.fillRect(mrnd(0, w), mrnd(0, h), mrnd(1, 2.5), mrnd(.5, 1.5)); }
}

// ---------- 桌面：米白纸，上面印着几块色 ----------
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2).translate(0, -.02, 0), new THREE.MeshStandardMaterial({color: FLOOR, roughness: 1}));
  floor.receiveShadow = true; world.add(floor);
  const g = new GB();
  const block = (x0, z0, x1, z1, y, col, ink, pat) => { const w = x1 - x0, d = z1 - z0; g.M.makeTranslation((x0 + x1) / 2, y, (z0 + z1) / 2); g.rect(Vt(-w / 2, 0, d / 2), X, NZ, w, d, C(col), C(ink), pat, rnd(0, 40)); };

    uRes: {value: new THREE.Vector2(CW, CH)}, uNear: {value: camera.near}, uFar: {value: camera.far}, uLine: {value: .62}, uSeed: {value: 0}},

const stage = $('stage');
let lang = new URLSearchParams(location.search).get('lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
let run = 0, tapResolve = null, closed = false, taps = 0, offlineTimer = 0;
const AUTO = window.__auto || (STILL ? {path: [1, 0, 0, 1], still: true} : null);

function fit() { const s = Math.min(innerWidth / 390, innerHeight / 844); stage.style.transform = 'scale(' + s + ')'; }
addEventListener('resize', fit); fit();

const sleep = ms => new Promise(r => setTimeout(r, AUTO ? 0 : ms));
function tap() {
  const u = UI[lang];
  if (taps < 2) { $('hint').textContent = u.tap; $('hint').classList.add('on'); }
  return new Promise(r => { tapResolve = () => { tapResolve = null; taps++; $('hint').classList.remove('on'); r(); }; if (AUTO) setTimeout(tapResolve, 0); });
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  if (closed) {
    const r = $('gl').getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(ndc, camera); if (ray.intersectObject(laptop, true).length) { showOffline(); return; }
  }
  if (tapResolve) tapResolve();
});

function showYou(t) { $('youText').textContent = t; $('you').classList.add('on'); chat.push({ai: false, t}); drawScreen(); }
function showAI(t) {
  const b = $('ai'); b.classList.remove('on'); void b.offsetWidth;
  $('aiText').textContent = t; b.classList.add('on'); chat.push({ai: true, t}); drawScreen(); talkT = T;
}
async function drop(opt, id) {
  const name = UI[lang].name, n = letters.length, j = .08 + n * .07;   // 纸越堆越乱
  if (opt.doc) { spawnLetter(opt.doc, name, {x: mrnd(-j, j), z: mrnd(-j * .7, j * .5), r: mrnd(-.06 - n * .03, .06 + n * .03)}, T); return; }
  if (opt.trio) {
    const pos = [{x: -.62, z: .12, r: .22}, {x: .02, z: -.12, r: -.04}, {x: .66, z: .16, r: -.24}];
    for (let i = 0; i < opt.trio.length; i++) { if (id !== run) return; spawnLetter(opt.trio[i], name, {...pos[i], compact: true}, T); await sleep(260); }
  }
}
function choose(opts) {
  const box = $('choices'), u = UI[lang];
  box.textContent = '';
  const l = document.createElement('div'); l.className = 'label'; l.textContent = u.choose; box.appendChild(l);
  $('you').classList.remove('on');
  return new Promise(res => {
    opts.forEach((o, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = o.you;
      b.addEventListener('click', () => { box.hidden = true; res(i); });
      box.appendChild(b);
    });
    box.hidden = false;
    if (AUTO) setTimeout(() => { box.hidden = true; res((AUTO.path || [])[AUTO.k = (AUTO.k || 0) + 1, AUTO.k - 1] || 0); }, 0);
  });
}
let buzzT = -9, talkT = -9, closeT = -1;
function ping(i) {
  const p = PINGS[lang][i]; if (!p) return;
  pings.unshift(p); if (pings.length > 4) pings.pop();
  drawPhone(p.time, UI[lang].day); phoneMat.emissiveIntensity = .9; buzzT = T;
}
function showOffline() {
  const o = $('offline'); o.textContent = UI[lang].offline; o.classList.add('on');
  clearTimeout(offlineTimer); offlineTimer = setTimeout(() => o.classList.remove('on'), 1800);
}
function reset() {
  clearLetters(); chat.length = 0; pings.length = 0; drawScreen(); drawPhone('', ''); phoneMat.emissiveIntensity = 0;
  closeT = -1; lid.rotation.x = LID_OPEN; screenMat.emissiveIntensity = .45; closed = false;
  ['ai', 'you', 'hint', 'offline', 'end'].forEach(id => $(id).classList.remove('on'));
  $('choices').hidden = true; tapResolve = null;
  const u = UI[lang];
  $('aiLabel').textContent = u.ai; $('youLabel').textContent = u.you; $('claim').textContent = u.claim; $('again').textContent = u.again; $('lang').textContent = u.switchTo;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
}
async function play(reprint) {
  const id = ++run; reset(); taps = 0;
  if (reprint) { T = 0; await sleep(1500); } else await sleep(400);
  if (id !== run) return;
  const steps = STORY[lang]; let ci = 0;
  for (const step of steps) {
    if (id !== run) return;
    if (step.you) { showYou(step.you); await tap(); }
    else if (step.ai) { showAI(step.ai); await tap(); }
    else if (step.choice) {
      ping(ci++); await sleep(900); if (id !== run) return;
      const i = await choose(step.choice); if (id !== run) return;
      const o = step.choice[i];
      showYou(o.you); await sleep(650); if (id !== run) return;
      showAI(o.ai); await sleep(250); await drop(o, id); if (id !== run) return;
      await tap();
    }
    else if (step.end) {
      if (AUTO && AUTO.still) { stage.classList.add('still'); return; }
      await sleep(500);
      $('ai').classList.remove('on'); $('you').classList.remove('on');
      closeT = T; closed = true;
      await sleep(1600); phoneMat.emissiveIntensity = 0;
      await sleep(1800); if (id !== run) return;

    }

}

// ---------- 主循环 ----------
let T = 0, last = performance.now();
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now; T += dt;
  uClock.value = T;
  for (const m of lateShow) m.visible = T > m.userData.showAt;
  // 纸：从空中落下，同时被扫描线从纸头往下印出来
  for (const l of letters) {
    const u = l.userData, a = T - u.t0; if (a < 0) continue; l.visible = true;
    const f = clamp(a / .75, 0, 1), e = 1 - Math.pow(1 - f, 3);
    l.position.y = u.y + (1 - e) * 2.2; l.rotation.y = u.r + (1 - e) * .5; l.rotation.z = Math.sin(f * Math.PI * 2) * (1 - f) * .12;
    u.mat.userData.rev.value = clamp(a / .55, 0, 1); u.flag.visible = a > .5;
  }
  // 手机：震一下
  const ba = T - buzzT; phone.position.x = 2.2 + (ba < .6 ? Math.sin(ba * 90) * .03 * (1 - ba / .6) : 0);
  // 屏幕：AI 说话时亮一下；结尾盖子合上
  screenMat.emissiveIntensity = closeT < 0 ? .45 + .3 * Math.exp(-(T - talkT) * 4) : Math.max(0, .45 * (1 - (T - closeT) / .5));
  if (closeT >= 0) lid.rotation.x = lerp(LID_OPEN, 0, ease(clamp((T - closeT) / 1.3, 0, 1)));
  dustU.uTime.value = T; dustU.tShadow.value = sun.shadow.map ? sun.shadow.map.texture : null; dustU.uOn.value = sun.shadow.map ? 1 : 0;
  vol.uniforms.uSeed.value = (T * 12 | 0) % 7;
  composer.render();
}
function loop(now) { if (!window.__paused) frame(now); requestAnimationFrame(loop); }

$('again').addEventListener('click', () => play(true));
$('lang').addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; play(false); });
window.__adv = sec => { const t0 = performance.now(); for (let k = 0; k < Math.round(sec * 30); k++) frame(last + 1000 / 30); return performance.now() - t0; };
window.__fx = {camera, CAMV, placeCamera, uWin, vol, tiltH, tiltV, sun, letters, lid, world, frame, get T() { return T; }};

$('loading').textContent = UI[lang].loading;
drawScreen(); drawPhone('', '');
renderer.compile(scene, camera);
requestAnimationFrame(() => { $('loading').classList.add('off'); T = 0; last = performance.now(); requestAnimationFrame(loop); play(true);
  if (STILL) setTimeout(() => { window.__paused = true; for (let k = 0; k < 300; k++) frame(last + 1000 / 30); }, 300); });
</script>
